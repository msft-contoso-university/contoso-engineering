name: Candidate runtime integration
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: msft-contoso-university/contoso-engineering/.github/actions/story-gate@177851bad37f10f6b68c8d864e470ee743288e59
        with:
          github-token: ${{ github.token }}
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.pins.outputs.web }}
      students: ${{ steps.pins.outputs.students }}
      academics: ${{ steps.pins.outputs.academics }}
      enrollments: ${{ steps.pins.outputs.enrollments }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: pins
        run: python3 tools/runtime_checks.py pins
  integration:
    needs: pins
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      sql:
        image: mcr.microsoft.com/mssql/server@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Runtime_CI_Only_Pass123!
        ports: ['127.0.0.1:1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Runtime_CI_Only_Pass123!' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      CONTOSO_RUNTIME_SOURCES: ${{ github.workspace }}/services
      CONTOSO_RUNTIME_SQL_CONNECTION: Server=127.0.0.1,1433;User ID=sa;Password=Runtime_CI_Only_Pass123!;Encrypt=False
    defaults:
      run:
        working-directory: engineering
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: engineering
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: msft-contoso-university/contoso-web
          ref: ${{ needs.pins.outputs.web }}
          path: services/contoso-web
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: msft-contoso-university/contoso-students
          ref: ${{ needs.pins.outputs.students }}
          path: services/contoso-students
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: msft-contoso-university/contoso-academics
          ref: ${{ needs.pins.outputs.academics }}
          path: services/contoso-academics
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: msft-contoso-university/contoso-enrollments
          ref: ${{ needs.pins.outputs.enrollments }}
          path: services/contoso-enrollments
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.404'
      - name: Validate actual immutable sources
        run: python3 tools/runtime_checks.py sources --directory "$CONTOSO_RUNTIME_SOURCES"
      - name: Guard policy tests
        run: python3 -m unittest discover -s tests -v
      - name: Locked audited restore
        run: dotnet restore tests/RuntimeIntegration/RuntimeIntegration.csproj --locked-mode
      - name: Build actual service applications and external harness
        run: dotnet build tests/RuntimeIntegration/RuntimeIntegration.csproj -c Release --no-restore
      - name: Exercise actual HTTP pipelines and independent SQL databases
        run: dotnet test tests/RuntimeIntegration/RuntimeIntegration.csproj -c Release --no-build --no-restore --logger trx --results-directory artifacts/runtime
      - name: Require complete runtime evidence
        run: python3 tools/runtime_checks.py results --directory artifacts/runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: runtime-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: engineering/artifacts/runtime
          if-no-files-found: error
          retention-days: 7
  required:
    name: Runtime integration gate
    if: always()
    needs: [pins, integration, story]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          PINS: ${{ needs.pins.result }}
          INTEGRATION: ${{ needs.integration.result }}
          STORY: ${{ needs.story.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$PINS" = success
          test "$INTEGRATION" = success
          if [ "$EVENT" = pull_request ]; then test "$STORY" = success; else test "$STORY" = skipped; fi
